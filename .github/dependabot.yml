version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - astro
          - '@astrojs/*'
          - tailwindcss
          - '@tailwindcss/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
