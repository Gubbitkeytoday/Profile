version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # @astrojs/check (used by `npm run check` in CI) peers on typescript ^5 || ^6.
      # Remove this once it supports TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
        exclude-patterns:
          - astro
          - '@astrojs/*'
          - tailwindcss
          - '@tailwindcss/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
